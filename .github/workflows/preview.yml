name: PR Preview

# Builds every pull request into gh-pages/pr-preview/pr-<number>/ and
# comments the preview link on the PR. The preview is removed when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# One group per PR: a newer push to the same PR may replace a waiting preview,
# but a preview never replaces the main deploy (see deploy.yml).
concurrency:
  group: gh-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
