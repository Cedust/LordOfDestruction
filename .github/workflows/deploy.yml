name: Deploy to GitHub Pages

# Publishes main to the root of the gh-pages branch.
# PR previews live in gh-pages/pr-preview/ and are left untouched.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Own group, so a PR preview starting or closing at the same time (as on every
# merge) can no longer replace this run while it waits. Both workflows still push
# to gh-pages, so a push that loses the race is simply retried below.
concurrency:
  group: gh-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Deploy (retry)
        if: steps.deploy.outcome == 'failure'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
