<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140f1c" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Lord of Destruction</title>
    <script type="module" crossorigin src="./assets/index-B4udktxO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D_x6u5X6.css">
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="stat-chip"><span class="label">Wave</span><span id="wave">1</span></div>
        <div class="stat-chip gold"><span class="label">Gold</span><span id="gold">0</span></div>
        <div class="stat-chip dread"><span class="label">Dread</span><span id="dread">0</span></div>
        <div class="stat-chip sigil"><span class="label">Sigils</span><span id="sigils">0</span></div>
        <div class="stat-chip"><span class="label">Best</span><span id="best">0</span></div>
        <button id="speed" class="speed" aria-label="Game speed">1×</button>
      </header>

      <section class="battle-wrap">
        <canvas id="battle"></canvas>
        <div id="status" class="status"></div>
      </section>

      <div class="hp-bar" aria-label="Your life">
        <div id="hp-fill" class="hp-fill"></div>
        <span id="hp-text" class="hp-text"></span>
      </div>

      <nav class="tabs">
        <button class="tab" data-tab="powers">Powers</button>
        <button class="tab" data-tab="dread">Dread</button>
        <button class="tab" data-tab="pacts">Pacts</button>
      </nav>

      <section class="lists">
        <div id="powers-list" class="list"></div>
        <div id="dread-list" class="list" hidden>
          <p class="hint" id="dread-preview"></p>
          <div id="dread-upgrades" class="list compact"></div>
        </div>
        <div id="pacts-list" class="list" hidden>
          <p class="hint" id="pacts-preview"></p>
          <div id="pacts-tree"></div>
        </div>
      </section>

      <div id="choose" class="overlay" hidden>
        <div class="panel">
          <h1 class="choose-title">Choose Your Path</h1>
          <p class="sub">Pick How You Defeat the Heroes. More Pacts Come Later.</p>
          <div id="choose-list" class="list compact"></div>
        </div>
      </div>

      <div id="fallen" class="overlay" hidden>
        <div class="panel">
          <h1>You Have Fallen</h1>
          <p id="fallen-runs" class="sub"></p>
          <p class="big">Wave <span id="fallen-wave">0</span></p>
          <p id="fallen-best" class="sub"></p>
          <p class="gain">+<span id="fallen-dread-gain">0</span> ☠ Dread <span class="sub">(Total <span id="fallen-total">0</span>)</span></p>
          <p id="fallen-bonus" class="sub"></p>
          <p id="fallen-sigils" class="gain sigil"></p>
          <div class="segs">
            <button class="seg" data-view="dread">Dread Upgrades</button>
            <button class="seg" data-view="pacts">Dark Pacts</button>
          </div>
          <div id="fallen-dread" class="list compact"></div>
          <div id="fallen-pacts">
            <p class="sub" id="fallen-sigil-hint"></p>
            <div id="fallen-tree"></div>
            <button class="reset-pacts">Reset Pacts</button>
          </div>
          <div class="fallen-footer">
            <div id="fallen-detail"></div>
            <button id="rise" class="rise">Rise Again</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
