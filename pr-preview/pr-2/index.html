<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140f1c" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Lord of Destruction</title>
    <script type="module" crossorigin src="./assets/index-BVc8Rzcc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dr11Qs1W.css">
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="stat-chip"><span class="label">Wave</span><span id="wave">1</span></div>
        <div class="stat-chip gold"><span class="label">Gold</span><span id="gold">0</span></div>
        <div class="stat-chip dread"><span class="label">Dread</span><span id="dread">0</span></div>
        <div class="stat-chip"><span class="label">Best</span><span id="best">0</span></div>
        <button id="speed" class="speed" aria-label="Game speed">1×</button>
      </header>

      <section class="battle-wrap">
        <canvas id="battle"></canvas>
        <div id="status" class="status"></div>
      </section>

      <div class="hp-bar" aria-label="Your life">
        <div id="hp-fill" class="hp-fill"></div>
        <span id="hp-text" class="hp-text"></span>
      </div>

      <nav class="tabs">
        <button class="tab" data-tab="powers">Powers</button>
        <button class="tab" data-tab="dread">Dread</button>
      </nav>

      <section class="lists">
        <div id="powers-list" class="list"></div>
        <div id="dread-list" class="list" hidden>
          <p class="hint" id="dread-preview"></p>
        </div>
      </section>

      <div id="fallen" class="overlay" hidden>
        <div class="panel">
          <h1>You have fallen</h1>
          <p class="big">Wave <span id="fallen-wave">0</span></p>
          <p id="fallen-best" class="sub"></p>
          <p class="gain">+<span id="fallen-dread">0</span> ☠ Dread <span class="sub">(total <span id="fallen-total">0</span>)</span></p>
          <div id="fallen-dread-list" class="list compact"></div>
          <button id="rise" class="rise">Rise again</button>
        </div>
      </div>
    </main>
  </body>
</html>
